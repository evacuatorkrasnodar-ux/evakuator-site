<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заявка — Эвакуатор Краснодар 24/7</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta name="theme-color" content="#000000">
</head>

<body class="theme-dark">

<div class="container">

  <!-- HERO -->
  <header class="hero fade-in">
    <div class="hero-bg"></div>
  </header>

  <!-- ТЕМА -->
  <button id="themeToggle" class="apple-glass-btn theme-btn fade-in">
    Светлая / Тёмная
  </button>

  <!-- УСТАНОВКА -->
  <button id="installBtn" class="apple-glass-btn install-btn fade-in">
    Установить приложение
  </button>

  <!-- ЗАГОЛОВОК -->
  <section class="section fade-in">
    <h2>Оставить заявку</h2>
    <p class="muted">
      Заполните форму — мы свяжемся с вами в течение нескольких минут.
    </p>
  </section>

  <!-- ФОРМА -->
  <section class="section fade-in">

    <form id="requestForm">

      <label>Ваше имя</label>
      <input type="text" name="name" required class="apple-input">

      <label>Телефон</label>
      <input type="tel" name="phone" required class="apple-input">

      <label>Адрес подачи</label>
      <input type="text" name="address" required class="apple-input">

      <label>Комментарий</label>
      <textarea name="comment" class="apple-input"></textarea>

      <button type="submit" class="apple-glass-btn" style="margin-top:15px;">
        Отправить заявку
      </button>

    </form>

    <div id="requestStatus" class="muted" style="margin-top:15px;"></div>

  </section>

  <!-- ФУТЕР -->
  <footer class="footer fade-in">
    <div class="footer-grid">
      <div>
        <h3>Эвакуатор Краснодар 24/7</h3>
        <p>Работаем круглосуточно.</p>
        <p>Адрес: Дзержинского 100</p>
      </div>
      <div>
        <h3>Телефон</h3>
        <p><a href="tel:+79888717018">+7 (988) 871‑70‑18</a></p>
      </div>
      <div class="footer-right">
        <h3>Версия</h3>
        <p><a href="en.html">English</a></p>
      </div>
    </div>
  </footer>

</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="bottom-menu">
  <a href="index.html">Главная</a>
  <a href="prices.html">Цены</a>
  <a href="request.html">Заявка</a>
  <a href="#top">Наверх</a>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button onclick="closeModal()" class="apple-glass-btn">Закрыть</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
