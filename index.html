<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Эвакуатор Краснодар 24/7</title>

<link rel="manifest" href="manifest.json">
<script src="https://api-maps.yandex.ru/2.1/?apikey=fc0f9182-0eee-4e83-bed3-8e561c88c4d5&lang=ru_RU"></script>

<style>
/* ГЛОБАЛЬНАЯ МОБИЛЬНАЯ ОПТИМИЗАЦИЯ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin:0;
  background:#000;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  color:#fff;
  overflow-x:hidden;
}

.container {
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* ШАПКА */
.header {
  background:rgba(20,20,20,0.7);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:22px;
  box-shadow:0 0 30px rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:20px;
}

.header img {
  height:160px;
  width:auto;
  flex-shrink:0;
}

.header-title {
  flex:1;
  text-align:center;
}

.header-title h1 {
  font-size:30px;
  margin:0;
  font-weight:700;
}

.header-phone {
  margin-top:8px;
  font-size:20px;
  font-weight:600;
}

/* КНОПКИ */
.uber-btn {
  width:100%;
  padding:16px;
  background:#fff;
  color:#000;
  font-size:20px;
  font-weight:700;
  border:none;
  border-radius:16px;
  margin:14px 0;
  box-shadow:0 0 18px rgba(255,255,255,0.25);
  transition:0.25s;
  text-align:center;
  display:block;
  text-decoration:none;
}

.uber-btn:hover {
  transform:translateY(-2px);
}

/* СЕКЦИИ */
.section {
  background:rgba(20,20,20,0.6);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:22px;
  margin-bottom:20px;
  border:1px solid rgba(255,255,255,0.05);
}

.section h2 {
  font-size:24px;
  margin-bottom:16px;
}

/* СПИСОК ПРЕИМУЩЕСТВ */
@keyframes uberFade {
  0% { opacity:0; transform:translateY(10px); }
  100% { opacity:1; transform:translateY(0); }
}

.adv-item {
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.10);
  font-size:19px;
  opacity:0.95;
}

/* КАЛЬКУЛЯТОР */
.calc-row {
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

input, select {
  flex:1;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);
  color:#fff;
  font-size:18px;
}

#map {
  width:100%;
  height:240px;
  border-radius:18px;
  margin-top:16px;
}

/* МЕССЕНДЖЕРЫ */
.messengers {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.msg-btn {
  flex:1;
  padding:14px;
  border-radius:14px;
  font-size:18px;
  font-weight:700;
  border:none;
}

.whatsapp { background:#25D366; color:#000; }
.telegram { background:#0088cc; color:#fff; }
.vk { background:#4a76a8; color:#fff; }

/* ОТЗЫВЫ */
.review {
  background:rgba(255,255,255,0.05);
  padding:16px;
  border-radius:14px;
  margin-bottom:10px;
  font-size:18px;
}

/* ФУТЕР */
.footer {
  text-align:center;
  padding:16px;
  font-size:20px;
  background:rgba(255,255,255,0.05);
  border-radius:18px;
  margin-top:20px;
}

/* МОБИЛЬНЫЙ РЕЖИМ */
@media (max-width:480px) {
  .header img { height:130px; }
  .header-title h1 { font-size:26px; }
  .uber-btn { font-size:18px; padding:14px; }
  .msg-btn { font-size:16px; }
}
</style>
</head>
