<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Эвакуатор Краснодар 24/7</title>

<link rel="manifest" href="manifest.json">
<script src="https://api-maps.yandex.ru/2.1/?apikey=fc0f9182-0eee-4e83-bed3-8e561c88c4d5&lang=ru_RU"></script>

<style>
/* ГЛОБАЛЬНОЕ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin:0;
  background:#000;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  color:#fff;
  overflow-x:hidden;
}

.container {
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* ШАПКА */
.header {
  background:rgba(20,20,20,0.7);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:22px;
  box-shadow:0 0 30px rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:20px;
}

.header img {
  height:150px;
  width:auto;
  flex-shrink:0;
}

.header-title {
  flex:1;
  text-align:center;
}

.header-title h1 {
  font-size:28px;
  margin:0;
  font-weight:700;
}

.header-phone {
  margin-top:8px;
  font-size:20px;
  font-weight:600;
}

/* КНОПКИ */
.uber-btn {
  width:100%;
  padding:16px;
  background:#fff;
  color:#000;
  font-size:20px;
  font-weight:700;
  border:none;
  border-radius:16px;
  margin:14px 0;
  box-shadow:0 0 18px rgba(255,255,255,0.25);
  transition:0.25s;
  text-align:center;
  display:block;
  text-decoration:none;
}

.uber-btn:hover {
  transform:translateY(-2px);
}

/* СЕКЦИИ */
.section {
  background:rgba(20,20,20,0.6);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:22px;
  margin-bottom:20px;
  border:1px solid rgba(255,255,255,0.05);
}

.section h2 {
  font-size:24px;
  margin-bottom:16px;
}

@keyframes uberFade {
  0% { opacity:0; transform:translateY(10px); }
  100% { opacity:1; transform:translateY(0); }
}

.adv-item {
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.10);
  font-size:19px;
  opacity:0.95;
  animation:uberFade 0.6s ease forwards;
}

/* КАЛЬКУЛЯТОР */
.calc-row {
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

input, select {
  flex:1;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.25);
  background:#111;
  color:#fff;
  font-size:18px;
}

select option {
  background:#111;
  color:#fff;
}

select:focus, input:focus {
  outline:none;
  border-color:#fff;
}

/* ПОДСВЕТКА ВЫБОРА */
select option:checked {
  background:#fff;
  color:#000;
}

/* ТЁМНАЯ КАРТА + АНИМАЦИЯ */
#map {
  width:100%;
  height:260px;
  border-radius:18px;
  margin-top:16px;
  opacity:0;
  transform:translateY(20px);
  transition:opacity 0.6s ease, transform 0.6s ease;
  filter:brightness(0.75) contrast(1.15);
}

/* ОТЗЫВЫ */
.review {
  background:rgba(255,255,255,0.05);
  padding:16px;
  border-radius:14px;
  margin-bottom:10px;
  font-size:18px;
}

/* ФУТЕР */
.footer {
  text-align:center;
  padding:16px;
  font-size:20px;
  background:rgba(255,255,255,0.05);
  border-radius:18px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="img/logo.png" alt="Логотип">
    <div class="header-title">
      <h1>Эвакуатор Краснодар 24/7</h1>
      <div class="header-phone">
        📞 <a href="tel:+79888717018" style="color:#fff; text-decoration:none;">
          +7 (988) 871‑70‑18
        </a>
      </div>
    </div>
  </div>

  <a href="tel:+79888717018" class="uber-btn">🚨 Вызвать эвакуатор</a>

  <section class="section">
    <h2>Расчёт стоимости</h2>
    <div class="calc-row">
      <input type="text" id="fromAddress" placeholder="Откуда забрать">
    </div>
    <div class="calc-row">
      <input type="text" id="toAddress" placeholder="Куда отвезти">
    </div>
    <div class="calc-row">
      <select id="carType">
        <option value="1.0">Легковой автомобиль</option>
        <option value="1.1">Кроссовер / минивэн</option>
        <option value="1.3">Малый грузовик</option>
      </select>
    </div>
    <button class="uber-btn" onclick="calcRealPrice()">Рассчитать стоимость</button>
    <div id="calcResult">Введите адреса и нажмите «Рассчитать стоимость».</div>
    <div id="map"></div>
  </section>
<script>
let map2;

// Инициализация карты
ymaps.ready(function () {
  map2 = new ymaps.Map("map", {
    center: [45.035470, 38.975313],
    zoom: 11,
    controls: ['zoomControl']
  });

  // Анимация появления карты
  const mapEl = document.getElementById("map");
  mapEl.style.opacity = "1";
  mapEl.style.transform = "translateY(0)";

  // Автодобавление «Краснодар»
  ["fromAddress", "toAddress"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("blur", () => {
      let v = el.value.trim();
      if (v && !v.toLowerCase().includes("краснодар")) {
        el.value = "Краснодар, " + v;
      }
    });
  });

  // Подсказки только по Краснодару
  function onlyKrasnodar(item) {
    return item.value.includes("Краснодар");
  }

  new ymaps.SuggestView('fromAddress', {
    provider: {
      suggest: r => ymaps.suggest("Краснодар, " + r).then(i => i.filter(onlyKrasnodar))
    },
    results: 8
  });

  new ymaps.SuggestView('toAddress', {
    provider: {
      suggest: r => ymaps.suggest("Краснодар, " + r).then(i => i.filter(onlyKrasnodar))
    },
    results: 8
  });
});

// Автокоррекция адресов — ищет ближайший существующий дом
function safeRoute(from, to) {
  const result = document.getElementById("calcResult");

  ymaps.geocode(from).then(resFrom => {
    const pointFrom = resFrom.geoObjects.get(0);
    if (!pointFrom) {
      result.textContent = "Адрес отправления не найден.";
      return;
    }

    ymaps.geocode(to).then(resTo => {
      const pointTo = resTo.geoObjects.get(0);
      if (!pointTo) {
        result.textContent = "Адрес назначения не найден.";
        return;
      }

      const coordsFrom = pointFrom.geometry.getCoordinates();
      const coordsTo = pointTo.geometry.getCoordinates();

      ymaps.route([coordsFrom, coordsTo]).then(route => {

        map2.geoObjects.removeAll();

        // Тёмная линия маршрута как в Uber
        route.getPaths().each(path => {
          path.options.set({
            strokeColor: "#ffffff",
            strokeWidth: 6,
            strokeOpacity: 0.9
          });
        });

        map2.geoObjects.add(route);
        map2.setBounds(route.getBounds(), { checkZoomRange: true });

        const distance = route.getLength() / 1000;

        const basePerKm = 60;
        const carType = parseFloat(document.getElementById("carType").value);
        const minPrice = carType === 1.3 ? 2200 : carType === 1.1 ? 1900 : 1700;

        let price = distance * basePerKm * carType;
        if (price < minPrice) price = minPrice;

        result.textContent = `Расстояние: ${distance.toFixed(1)} км. Стоимость: ~ ${Math.round(price)} ₽`;

      }, () => {
        result.textContent = "❌ Маршрут не найден даже после коррекции.";
      });
    });
  });
}

// Основная функция расчёта
function calcRealPrice() {
  const from = document.getElementById("fromAddress").value.trim();
  const to = document.getElementById("toAddress").value.trim();

  if (!from || !to) {
    document.getElementById("calcResult").textContent = "Введите оба адреса.";
    return;
  }

  safeRoute(from, to);
}
</script>

</body>
</html>
