<body>

<div class="container">

            <select id="carType">
                <option value="1.0">Легковой автомобиль</option>

        <!-- ОДНА КНОПКА: строит маршрут + считает цену -->
        <button class="calc-btn" onclick="calcRouteAndPrice()">Рассчитать стоимость</button>

<script>
// =========================
// PWA кнопка установки
// =========================

let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", () => {
    installBtn.style.display = "none";
    deferredPrompt.prompt();
});

// =========================
// Яндекс.Карты + подсказки адресов
// =========================

let map, route;
let ymapsReady = false;

ymaps.ready(() => {
    ymapsReady = true;

    map = new ymaps.Map("map", {
        center: [45.035470, 38.975313],
        zoom: 9
    });

    // Иконка эвакуатора
    var evacIcon = new ymaps.Placemark([45.035470, 38.975313], {
        balloonContent: 'Эвакуатор Краснодар 24/7'
    }, {
        iconLayout: 'default#image',
        iconImageHref: 'https://cdn-icons-png.flaticon.com/512/743/743131.png',
        iconImageSize: [40, 40],
        iconImageOffset: [-20, -20]
    });

    map.geoObjects.add(evacIcon);

    // Подсказки адресов (как в такси)
    var fromSuggest = new ymaps.SuggestView('fromAddress');
    var toSuggest = new ymaps.SuggestView('toAddress');

    // Авто‑заполнение "Откуда" по геолокации
    autoFillFrom();
});

// ОДНА ФУНКЦИЯ: строит маршрут + считает цену
function calcRouteAndPrice() {
    const from = document.getElementById("fromAddress").value.trim();
    const to = document.getElementById("toAddress").value.trim();
    const result = document.getElementById("calcResult");

    if (!from || !to) {
        result.textContent = "Введите оба адреса.";
        return;
    }

    if (!ymapsReady) {
        result.textContent = "Карта загружается…";
        return;
    }

    result.textContent = "Строим маршрут и считаем стоимость…";

    if (route) map.geoObjects.remove(route);

    ymaps.route([from, to]).then(r => {
        route = r;
        map.geoObjects.add(route);
        map.setBounds(route.getBounds());

        const meters = route.getLength();
        const km = Math.round(meters / 1000);

        // Расчёт цены
        const carType = parseFloat(document.getElementById("carType").value);

        const basePerKm = 60;
        const minCar = 1700;
        const minCross = 1900;
        const minTruck = 2200;

        let minPrice = minCar;
        if (carType === 1.1) minPrice = minCross;
        if (carType === 1.3) minPrice = minTruck;

        let price = km * basePerKm * carType;
        if (price < minPrice) price = minPrice;

        result.textContent =
            "Расстояние: ~ " + km + " км. Цена эвакуации: ~ " + Math.round(price) + " ₽";
    }).catch(() => {
        result.textContent = "Маршрут не найден. Уточните адреса.";
    });
}

// Авто‑заполнение адреса "Откуда"
function autoFillFrom() {
    ymaps.geolocation.get().then(function (res) {
        var userCoords = res.geoObjects.get(0).geometry.getCoordinates();

        ymaps.geocode(userCoords).then(function (geo) {
            var address = geo.geoObjects.get(0).getAddressLine();
            document.getElementById("fromAddress").value = address;
        });
    });
}

// =========================
// ЗАЯВКА
// =========================

function submitForm() {
    window.location.href = "tel:+79888717018";
}

function sendWhatsApp() {
    window.open("https://wa.me/79888717018", "_blank");
}

function sendTelegram() {
    window.open("https://t.me/", "_blank"); // добавишь позже
}
</script>
