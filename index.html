<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эвакуатор Краснодар 24/7</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

<!-- Яндекс.Карты API 3.0 — для отображения карты -->
<script src="https://api-maps.yandex.ru/v3/?apikey=fc0f9182-0eee-4e83-bed3-8e561c88c4d5&lang=ru_RU"></script>

<!-- Яндекс.Карты API 2.1 — только для маршрута и геокодера -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=fc0f9182-0eee-4e83-bed3-8e561c88c4d5&lang=ru_RU"></script>

<style>
body { margin:0; background:#0a0a0a; font-family:Arial,sans-serif; color:#fff; }
.container { max-width:900px; margin:auto; padding:20px; }
h1 { text-align:center; color:#f7c600; margin-bottom:10px; }

.install-btn { width:100%; padding:14px; background:#0088ff; border:none; border-radius:10px;
               font-size:18px; font-weight:bold; cursor:pointer; margin-bottom:20px; display:none; }

.top-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; }
.rating { display:flex; align-items:center; gap:8px; }
.stars { color:#f7c600; font-size:18px; }
.avito { display:flex; align-items:center; gap:6px; font-size:14px; }
.avito-icon { width:20px; height:20px; border-radius:4px; background:#00aaff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; }

.calc-block { background:#111; padding:20px; border-radius:15px; border:1px solid #333; margin-bottom:20px; }
.calc-row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
input, select { flex:1; padding:12px; border-radius:10px; border:1px solid #444;
                background:#1a1a1a; color:#fff; font-size:15px; }
.calc-btn { width:100%; padding:14px; background:linear-gradient(135deg,#f7c600,#ff7b00);
            border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; color:#000; }
#calcResult { margin-top:10px; font-size:18px; color:#f7c600; }
#map { width:100%; height:250px; border-radius:15px; margin-top:15px; }

.form-block { background:#111; padding:20px; border-radius:15px; border:1px solid #333; }
.form-submit { width:100%; padding:14px; background:linear-gradient(135deg,#ff7b00,#f7c600);
               border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; color:#000; margin-top:10px; }
.messengers { display:flex; gap:10px; margin-top:10px; }
.msg-btn { flex:1; padding:12px; border-radius:10px; border:none; font-size:16px; font-weight:bold; cursor:pointer; }
.whatsapp { background:#25D366; color:#000; }
.telegram { background:#0088cc; color:#fff; }

.nav-btn { width:100%; padding:12px; margin-top:10px; border-radius:10px; border:none;
           background:#222; color:#fff; font-size:15px; cursor:pointer; }
</style>

</head>
<body>

<div class="container">
    <h1>Эвакуатор Краснодар 24/7</h1>

    <div class="top-info">
        <div class="rating">
            <span class="stars">★★★★★</span>
            <span>Рейтинг 4.9</span>
        </div>
        <div class="avito">
            <div class="avito-icon">A</div>
            <span>Эвакуатор на Авито</span>
        </div>
    </div>

    <!-- PWA кнопка -->
    <button class="install-btn" id="installBtn">📱 Сохранить на главный экран</button>

    <div class="calc-block">
        <h2>Расчёт стоимости</h2>

        <div class="calc-row">
            <input type="text" id="fromAddress" placeholder="Откуда забрать">
        </div>

        <div class="calc-row">
            <input type="text" id="toAddress" placeholder="Куда отвезти">
        </div>

        <div class="calc-row">
            <select id="carType">
                <option value="1.0">Легковой автомобиль</option>
                <option value="1.1">Кроссовер / минивэн</option>
                <option value="1.3">Малый грузовик</option>
            </select>
        </div>

        <button class="calc-btn" onclick="calcRouteAndPrice()">Рассчитать стоимость</button>

        <button class="nav-btn" onclick="openInNavigator()">Открыть маршрут в навигаторе</button>

        <div id="calcResult">Введите адреса и нажмите «Рассчитать стоимость».</div>

        <div id="map"></div>
    </div>

    <div class="form-block">
        <h2>Быстрая заявка</h2>

        <div class="calc-row">
            <input id="name" type="text" placeholder="Ваше имя">
        </div>

        <div class="calc-row">
            <input id="phone" type="tel" placeholder="Ваш телефон">
        </div>

        <div class="calc-row">
            <input id="details" type="text" placeholder="Откуда → Куда, авто, ситуация">
        </div>

        <button class="form-submit" onclick="submitForm()">Позвонить</button>

        <div class="messengers">
            <button class="msg-btn whatsapp" onclick="sendWhatsApp()">WhatsApp</button>
            <button class="msg-btn telegram" onclick="sendTelegram()">Telegram</button>
        </div>
    </div>
</div>

<script>
// =========================
// PWA кнопка установки
// =========================
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", () => {
    installBtn.style.display = "none";
    deferredPrompt.prompt();
});

// =========================
// Карта: API 3.0
// =========================
let map3;
ymaps3.ready.then(() => {
    map3 = new ymaps3.YMap(document.getElementById("map"), {
        location: {
            center: [38.975313, 45.035470],
            zoom: 10
        }
    });

    const layer = new ymaps3.YMapDefaultSchemeLayer();
    map3.addChild(layer);

    const controls = new ymaps3.YMapControls({ position: 'right' });
    controls.addChild(new ymaps3.YMapZoomControl());
    map3.addChild(controls);

    const marker = new ymaps3.YMapMarker(
        { coordinates: [38.975313, 45.035470] },
        document.createElement("div")
    );
    marker.element.style.width = "40px";
    marker.element.style.height = "40px";
    marker.element.style.backgroundImage = "url('https://cdn-icons-png.flaticon.com/512/743/743131.png')";
    marker.element.style.backgroundSize = "contain";
    marker.element.style.borderRadius = "50%";
    map3.addChild(marker);
});

// =========================
// Маршрут + расчёт: API 2.1
// =========================
let route2;

function calcRouteAndPrice() {
    const from = document.getElementById("fromAddress").value.trim();
    const to = document.getElementById("toAddress").value.trim();
    const result = document.getElementById("calcResult");

    if (!from || !to) {
        result.textContent = "Введите оба адреса.";
        return;
    }

    result.textContent = "Строим маршрут…";

    ymaps.ready(function () {
        ymaps.geocode(from).then(function (resFrom) {
            const fromCoords = resFrom.geoObjects.get(0).geometry.getCoordinates();

            ymaps.geocode(to).then(function (resTo) {
                const toCoords = resTo.geoObjects.get(0).geometry.getCoordinates();

                if (route2) {
                    map3 && map3.removeChild(route2);
                }

                ymaps.route([fromCoords, toCoords]).then(function (route) {
                    // Отображаем маршрут на старой карте API 2.1, но визуально он будет поверх div#map
                    const map2 = new ymaps.Map('map', {
                        center: fromCoords,
                        zoom: 10,
                        controls: []
                    });

                    map2.geoObjects.add(route);

                    const distance = route.getLength(); // в метрах
                    const km = Math.round(distance / 1000);

                    const carType = parseFloat(document.getElementById("carType").value);

                    const basePerKm = 60;
                    const minCar = 1700;
                    const minCross = 1900;
                    const minTruck = 2200;

                    let minPrice = minCar;
                    if (carType === 1.1) minPrice = minCross;
                    if (carType === 1.3) minPrice = minTruck;

                    let price = km * basePerKm * carType;
                    if (price < minPrice) price = minPrice;

                    result.textContent = `Расстояние: ~ ${km} км. Цена эвакуации: ~ ${Math.round(price)} ₽`;
                }, function () {
                    result.textContent = "❌ Маршрут не найден.";
                });
            }, function () {
                result.textContent = "❌ Адрес назначения не найден.";
            });
        }, function () {
            result.textContent = "❌ Адрес отправления не найден.";
        });
    });
}

// =========================
// Открыть маршрут в навигаторе
// =========================
function openInNavigator() {
    const from = document.getElementById("fromAddress").value.trim();
    const to = document.getElementById("toAddress").value.trim();

    if (!from || !to) return;

    const url = "https://yandex.ru/maps/?rtext=" +
        encodeURIComponent(from) + "~" +
        encodeURIComponent(to) +
        "&rtt=auto";

    window.open(url, "_blank");
}

// =========================
// Заявка и мессенджеры
// =========================
function submitForm() {
    window.location.href = "tel:+79888717018";
}

function sendWhatsApp() {
    window.open("https://wa.me/79888717018", "_blank");
}

function sendTelegram() {
    window.open("https://t.me/", "_blank");
}
</script>

</body>
</html>
