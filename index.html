<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Эвакуатор Краснодар 24/7</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

<style>
body { margin:0; background:#0a0a0a; font-family:Arial,sans-serif; color:#fff; }
.container { max-width:900px; margin:auto; padding:20px; }
h1 { text-align:center; color:#f7c600; margin-bottom:10px; }

.install-btn {
    width:100%;
    padding:14px;
    background:#0088ff;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
    display:none;
}
</style>

</head>
<body>

<div class="container">

<h1>Эвакуатор Краснодар 24/7</h1>

<button class="install-btn" id="installBtn">📱 Установить как приложение</button>

<script>
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", () => {
    installBtn.style.display = "none";
    deferredPrompt.prompt();
});
</script>

</div>

</body>
</html>
